<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morty Runner</title>
<style>
:root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc; --accent:#2f6fed; --danger:#c2410c; --ok:#15803d; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ecebe6; --muted:#a3a29b; --line:#33332f; --accent:#6c9bff; --danger:#fb923c; --ok:#4ade80; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:560px; margin:0 auto; padding:48px 16px 64px; }
h1 { font-size:24px; margin:0 0 6px; }
p.lead { color:var(--muted); margin:0 0 28px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
button, a.button { border:1px solid var(--line); background:transparent; color:inherit; padding:9px 16px; border-radius:9px; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
.primary { background:var(--accent) !important; border-color:var(--accent) !important; color:#fff !important; }
.big { width:100%; padding:13px; font-size:16px; font-weight:600; }
.danger { color:var(--danger); border-color:var(--danger); }
button:disabled { opacity:.5; cursor:default; }
ol { list-style:none; padding:0; margin:0; }
li.step { display:grid; grid-template-columns:22px 1fr; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
li.step:first-child { border-top:0; }
.dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); margin-top:4px; }
.step.active .dot { border-color:var(--accent); border-top-color:transparent; animation:spin 1s linear infinite; }
.step.waiting .dot { border-color:var(--accent); background:var(--accent); }
.step.done .dot { border-color:var(--ok); background:var(--ok); }
.step.failed .dot { border-color:var(--danger); background:var(--danger); }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .step.active .dot { animation:none; } }
.title { font-weight:600; }
.detail { color:var(--muted); font-size:13px; margin-top:2px; }
.action { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
.action input { flex:1 1 220px; min-width:0; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:transparent; color:inherit; font:inherit; }
footer { margin-top:18px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
footer button { padding:4px 10px; font-size:13px; }
.hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Morty runner</h1>
  <p class="lead">Start Claude Code on a GitHub Actions runner and continue in Morty. The runner stops when idle, after about 6 hours, or when you stop it.</p>

  <div class="card">
    <button id="start" class="primary big">Start</button>
    <ol id="steps" class="hidden">
      <li class="step" data-step="github"><span class="dot"></span><div><div class="title">Connect GitHub</div><div class="detail"></div>
        <div class="action hidden" id="github-action">
          <a id="github-create" class="button primary" target="_blank" rel="noopener">Create token</a>
          <input id="github-token" type="password" placeholder="Paste the github_pat_… token" autocomplete="off">
          <button id="github-submit">Continue</button>
        </div></div></li>
      <li class="step" data-step="runner"><span class="dot"></span><div><div class="title">Start the runner</div><div class="detail"></div></div></li>
      <li class="step" data-step="claude"><span class="dot"></span><div><div class="title">Sign in to Claude</div><div class="detail"></div>
        <div class="action hidden" id="claude-action">
          <button id="claude-open" class="primary">Open Claude sign-in</button>
          <input id="claude-code" placeholder="Paste the whole code Claude shows" autocomplete="off">
          <button id="claude-submit">Continue</button>
        </div></div></li>
      <li class="step" data-step="morty"><span class="dot"></span><div><div class="title">Connect to Morty</div><div class="detail"></div>
        <div class="action hidden" id="morty-action"><a id="morty-open" class="button primary" target="_blank" rel="noopener">Open in Morty</a></div></div></li>
    </ol>
  </div>

  <footer>
    <span id="run-info"></span>
    <span>
      <button id="stop" class="danger hidden" title="Shift-click to force stop without cleanup">Stop runner</button>
      <button id="forget">Forget saved sign-ins</button>
    </span>
  </footer>
</main>
<script type="module">
import { config } from "./config.js";
import {
  GitHub, RunChannel, checkToken, createKeyPair, decryptWith, encryptTo, randomId, sleep, tokenTemplateUrl, vault,
} from "./app.js";

const $ = (id) => document.getElementById(id);
const stepEl = (name) => document.querySelector(`[data-step="${name}"]`);
function step(name, state, detail = "") {
  const element = stepEl(name);
  element.className = `step ${state}`;
  element.querySelector(".detail").textContent = detail;
}

let current = null; // { github, runId }

/** Uses the saved token, or walks the user through creating one from GitHub's pre-filled template. */
async function connectGitHub() {
  const saved = await vault.get("github");
  if (saved?.token) {
    try { return await checkToken(saved.token, config.repository); }
    catch { await vault.set("github", null); }
  }
  step("github", "waiting", `Create a token, choose "Only select repositories" → ${config.repository.split("/")[1]}, then paste it here.`);
  $("github-create").href = tokenTemplateUrl(config.repository);
  $("github-action").classList.remove("hidden");
  for (;;) {
    const token = await new Promise((resolve) => {
      $("github-submit").onclick = () => resolve($("github-token").value.trim());
    });
    if (!token) continue;
    try {
      const github = await checkToken(token, config.repository);
      await vault.set("github", { token });
      $("github-action").classList.add("hidden");
      $("github-token").value = "";
      return github;
    } catch (error) {
      step("github", "waiting", `That token did not work (${String(error.message ?? error).slice(0, 120)}). Check the repository and permissions, then paste again.`);
    }
  }
}

$("start").addEventListener("click", async () => {
  $("start").classList.add("hidden");
  $("steps").classList.remove("hidden");
  for (const name of ["github", "runner", "claude", "morty"]) step(name, "");
  try {
    step("github", "active", "Checking GitHub access…");
    const github = await connectGitHub();
    step("github", "done", `Connected as ${github.login}`);

    step("runner", "active", "Dispatching the workflow…");
    const keys = await createKeyPair();
    const requestId = randomId("r-");
    await github.dispatch({ request_id: requestId, public_key: keys.publicKey, idle_minutes: String(config.idleMinutes) });
    const channel = new RunChannel(github, requestId);
    const startedAt = Date.now();
    let runnerKey = null;
    current = { github, runId: null };
    while (runnerKey === null) {
      if (Date.now() - startedAt > 15 * 60_000) throw new Error("The runner did not start within 15 minutes.");
      if (current.runId === null) {
        const run = (await github.runs()).find((item) => item.name.includes(requestId));
        if (run) { current.runId = run.id; $("stop").classList.remove("hidden"); $("run-info").innerHTML = `<a href="${run.url}" target="_blank" rel="noopener">Run ${run.id}</a>`; }
      }
      for (const message of await channel.receive()) {
        if (message.meta.type === "runner-key") runnerKey = message.payload.publicKey;
        if (message.meta.type === "error") throw new Error(message.payload.message);
      }
      step("runner", "active", `Waiting for the runner… ${Math.round((Date.now() - startedAt) / 1000)}s`);
      if (runnerKey === null) await sleep(4000);
    }
    step("runner", "done", "Runner is up");

    step("claude", "active", "Checking for a saved Claude sign-in…");
    const savedClaude = await vault.get("claude");
    if (savedClaude?.token) await channel.send("claude-token", await encryptTo(runnerKey, { token: savedClaude.token }), "Saved Claude sign-in.");
    else await channel.send("claude-login-request", {}, "Sign in to Claude.");

    let morty = null;
    while (morty === null) {
      for (const message of await channel.receive()) {
        const type = message.meta.type;
        if (type === "error") throw new Error(message.payload.message);
        if (type === "claude-token-rejected") {
          await vault.set("claude", null);
          await channel.send("claude-login-request", {}, "Sign in to Claude.");
        }
        if (type === "claude-login") {
          const { url } = await decryptWith(keys.privateKey, message.payload);
          step("claude", "waiting", "Sign in, then paste the code Claude shows.");
          await claudeCode(url, runnerKey, channel);
          step("claude", "active", "Checking the sign-in…");
        }
        if (type === "claude-token") {
          await vault.set("claude", await decryptWith(keys.privateKey, message.payload));
        }
        if (type === "morty") {
          morty = await decryptWith(keys.privateKey, message.payload);
        }
      }
      if (morty === null) {
        if (stepEl("claude").classList.contains("done")) step("morty", "active", "Connecting the runner to Morty…");
        await sleep(3000);
      }
      if (savedClaude?.token && !stepEl("claude").classList.contains("waiting")) step("claude", "done", "Using your saved sign-in");
    }
    step("claude", "done", "Signed in");
    const link = new URL(morty.url);
    if (link.origin !== "https://morty.build" || link.pathname !== "/continue") throw new Error("The runner returned an unexpected link.");
    $("morty-open").href = morty.url;
    $("morty-action").classList.remove("hidden");
    step("morty", "done", "Open within 10 minutes; Morty keeps this browser signed in for a day.");
  } catch (error) {
    const active = document.querySelector(".step.active, .step.waiting");
    if (active) step(active.dataset.step, "failed", String(error.message ?? error));
    else alert(String(error.message ?? error));
    $("start").textContent = "Start again";
    $("start").classList.remove("hidden");
  }
});

function claudeCode(url, runnerKey, channel) {
  $("claude-action").classList.remove("hidden");
  const signIn = new URL(url);
  if (signIn.protocol !== "https:" || !["claude.com", "claude.ai"].includes(signIn.hostname)) {
    throw new Error("The runner returned an unexpected sign-in link.");
  }
  $("claude-open").onclick = () => window.open(signIn, "_blank", "noopener");
  return new Promise((resolve) => {
    $("claude-submit").onclick = async () => {
      const code = $("claude-code").value.trim();
      if (!code) return;
      $("claude-submit").disabled = true;
      await channel.send("claude-code", await encryptTo(runnerKey, { code }), "Claude sign-in code.");
      $("claude-action").classList.add("hidden");
      $("claude-code").value = "";
      $("claude-submit").disabled = false;
      resolve();
    };
  });
}

$("stop").addEventListener("click", async (event) => {
  if (!current?.runId) return;
  const force = event.shiftKey;
  if (!confirm(force ? "Force stop skips cleanup. Continue?" : "Stop the runner? Morty access from this run will be revoked.")) return;
  try { await current.github.cancel(current.runId, force); $("run-info").textContent = "Stopping…"; $("stop").classList.add("hidden"); }
  catch (error) { alert(String(error.message ?? error)); }
});

$("forget").addEventListener("click", async () => {
  await vault.set("github", null);
  await vault.set("claude", null);
  $("forget").textContent = "Forgotten";
});
</script>
</body>
</html>
