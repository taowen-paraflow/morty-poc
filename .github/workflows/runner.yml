name: Morty runner
run-name: "morty-runner ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Launch id generated by the launcher page"
        required: true
        type: string
      public_key:
        description: "Base64 SPKI RSA public key of the launcher page"
        required: true
        type: string
      idle_minutes:
        description: "Stop after this many idle minutes"
        required: false
        default: "30"
        type: string

# One runner at a time; a second launch waits until the first ends.
concurrency:
  group: morty-runner
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  runner:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours; the script exits earlier on idle or at MAX_MINUTES.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Connect this runner to Morty
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          IDLE_MINUTES: ${{ inputs.idle_minutes }}
          MAX_MINUTES: "340"
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/runner.mjs
      - name: Clean up
        # Runs after idle exit, failure, or a graceful cancel from the launcher page; force-cancel skips it.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes @morty-build/cli@latest revoke-all-access || echo "No Morty identity to revoke."
          if [ -f /tmp/morty-poc-issue ]; then
            gh issue close "$(cat /tmp/morty-poc-issue)" --repo "$GITHUB_REPOSITORY" --comment "Run ended." || true
          fi
