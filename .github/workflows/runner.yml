name: Morty runner
run-name: "morty-runner ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Launch id generated by the launcher page"
        required: true
        type: string
      public_key:
        description: "Base64 SPKI RSA public key of the launcher page"
        required: true
        type: string
      idle_minutes:
        description: "Stop after this many idle minutes"
        required: false
        default: "30"
        type: string

# One runner at a time; a second launch waits until the first ends.
concurrency:
  group: morty-runner
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # Deletes superseded state caches after saving a new one.
  actions: write

jobs:
  runner:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours; the script exits earlier on idle or at MAX_MINUTES.
    timeout-minutes: 355
    env:
      # One fixed Morty state root, so the identity can be cached and every run is the same Morty computer.
      MORTY_STATE_DIRECTORY: /home/runner/.morty-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Public packages only; nothing private is cached here.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-claude-morty-v1
      - name: Install Claude Code and the terminal emulator its sign-in is read with
        run: |
          npm install --global @anthropic-ai/claude-code
          python3 -m pip install --user --break-system-packages pyte==0.8.2
          npx --yes @morty-build/cli@latest version || true
      # The newest encrypted state from earlier runs. Only the launcher page holds its key.
      - name: Restore encrypted state
        uses: actions/cache/restore@v4
        with:
          path: ~/morty-poc-cache
          key: morty-state-${{ github.run_id }}
          restore-keys: morty-state-
      - name: Connect this runner to Morty
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          IDLE_MINUTES: ${{ inputs.idle_minutes }}
          MAX_MINUTES: "340"
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/runner.mjs
      # The steps below run after idle exit, failure, or a graceful cancel from the launcher page; force-cancel skips them.
      - name: Stop Morty and pack encrypted state
        id: pack
        if: always()
        run: |
          npx --yes @morty-build/cli@latest stop || true
          node scripts/state.mjs pack
      - name: Save encrypted state
        if: always() && steps.pack.outputs.packed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/morty-poc-cache
          key: morty-state-${{ github.run_id }}
      - name: Clean up
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED: ${{ steps.pack.outputs.packed }}
        run: |
          if [ "$SAVED" = "true" ]; then
            for key in $(gh cache list --repo "$GITHUB_REPOSITORY" --key morty-state- --json key --jq '.[].key'); do
              [ "$key" = "morty-state-$GITHUB_RUN_ID" ] || gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || true
            done
          fi
          if [ -f /tmp/morty-poc-issue ]; then
            gh issue close "$(cat /tmp/morty-poc-issue)" --repo "$GITHUB_REPOSITORY" --comment "Run ended." || true
          fi
