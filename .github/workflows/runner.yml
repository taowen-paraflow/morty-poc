name: Morty runner
run-name: "morty-runner ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Launch id generated by the launcher page"
        required: true
        type: string
      public_key:
        description: "Base64 SPKI RSA public key the continue link is encrypted to"
        required: true
        type: string
      idle_minutes:
        description: "Stop after this many idle minutes"
        required: false
        default: "30"
        type: string

# One runner at a time; a second launch waits until the first ends.
concurrency:
  group: morty-runner
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  runner:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours; the script exits earlier on idle or at MAX_MINUTES.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Pi
        run: npm install --global @earendil-works/pi-coding-agent@1.5.2
      - name: Connect this runner to Morty
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          IDLE_MINUTES: ${{ inputs.idle_minutes }}
          MAX_MINUTES: "340"
          PI_MODELS_JSON: ${{ secrets.PI_MODELS_JSON }}
          PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
          PI_SETTINGS_JSON: ${{ secrets.PI_SETTINGS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/runner.mjs
      - name: Revoke Morty access
        # Runs after idle exit, failure, or a graceful cancel from the launcher page; force-cancel skips it.
        if: always()
        run: npx --yes @morty-build/cli@latest revoke-all-access || echo "No Morty identity to revoke."
